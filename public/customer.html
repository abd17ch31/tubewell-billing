<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Customer · Tubewell Billing</title>
  <link rel="stylesheet" href="/css/style.css?v=2" />
</head>
<body>
  <div class="container">
    <p><a href="/customers.html">← Back to Customers</a></p>

    <div id="main" class="stack">
      <p class="muted">Loading…</p>
    </div>
  </div>

  <!-- Edit customer dialog -->
  <dialog id="editDialog">
    <form id="editForm" class="dialog-body">
      <h2>Edit Customer</h2>
      <label for="eName">Name *</label>
      <input id="eName" required />
      <label for="eMobile">Mobile *</label>
      <input id="eMobile" inputmode="numeric" required />
      <label for="eAddress">Address / Village</label>
      <input id="eAddress" />
      <p id="editErr" class="error" hidden></p>
      <div class="dialog-actions">
        <button type="button" class="secondary" id="cancelEdit">Cancel</button>
        <button type="submit">Save</button>
      </div>
    </form>
  </dialog>

  <!-- Add bill dialog -->
  <dialog id="billDialog">
    <form id="billForm" class="dialog-body">
      <h2>Add Bill</h2>
      <label for="bDate">Date</label>
      <input id="bDate" type="date" required />
      <div class="row" style="gap:8px">
        <div style="flex:1">
          <label for="bStart">Start time</label>
          <input id="bStart" type="time" required />
        </div>
        <div style="flex:1">
          <label for="bEnd">End time</label>
          <input id="bEnd" type="time" required />
        </div>
      </div>
      <label>Total usage — auto, editable</label>
      <div class="row" style="gap:8px; align-items:center">
        <input id="bHours" type="number" min="0" step="1" value="2" inputmode="numeric" style="flex:1" />
        <span class="muted">hours</span>
        <input id="bMinutes" type="number" min="0" max="59" step="1" value="0" inputmode="numeric" style="flex:1" />
        <span class="muted">minutes</span>
      </div>
      <label for="bRate">Rate (₹ per hour)</label>
      <input id="bRate" type="number" step="0.01" min="0" value="80" required />
      <div class="card" style="margin-top:12px; background:#f9fafb">
        <div class="row-between">
          <span class="muted">Bill amount</span>
          <strong id="bAmount" style="font-size:1.15rem">₹0</strong>
        </div>
      </div>
      <p id="billErr" class="error" hidden></p>
      <div class="dialog-actions">
        <button type="button" class="secondary" id="cancelBill">Cancel</button>
        <button type="submit">Save Bill</button>
      </div>
    </form>
  </dialog>

  <!-- Pay bill dialog -->
  <dialog id="payDialog">
    <form id="payForm" class="dialog-body">
      <h2>Record Payment</h2>
      <div class="card" style="background:#f9fafb; margin-bottom:8px">
        <div class="row-between">
          <span class="muted">Current due</span>
          <strong id="payCurrentDue">₹0</strong>
        </div>
      </div>
      <label for="pDate">Payment date</label>
      <input id="pDate" type="date" required />
      <label for="pAmount">Amount paid (₹)</label>
      <input id="pAmount" type="number" step="0.01" min="0.01" required inputmode="decimal" />
      <label for="pMode">Payment mode</label>
      <select id="pMode" required>
        <option value="cash">Cash</option>
        <option value="online">Online</option>
      </select>
      <label for="pNote">Note / Reference (optional)</label>
      <input id="pNote" />
      <p id="payErr" class="error" hidden></p>
      <div class="dialog-actions">
        <button type="button" class="secondary" id="cancelPay">Cancel</button>
        <button type="submit">Save Payment</button>
      </div>
    </form>
  </dialog>

  <!-- Notebook due dialog -->
  <dialog id="nbDialog">
    <form id="nbForm" class="dialog-body">
      <h2>Add Notebook Due</h2>

      <label for="nDate">Date *</label>
      <input id="nDate" type="date" required />

      <label for="nAmount">Amount (₹) *</label>
      <input id="nAmount" type="number" step="0.01" min="0.01" required inputmode="decimal" />

      <label for="nNote">Note (optional)</label>
      <input id="nNote" placeholder="e.g. carried forward from notebook" />

      <p id="nbErr" class="error" hidden></p>

      <div class="dialog-actions">
        <button type="button" class="secondary" id="cancelNb">Cancel</button>
        <button type="submit">Save</button>
      </div>
    </form>
  </dialog>

  <script src="/js/api.js?v=13"></script>
  <script src="/js/format.js?v=13"></script>
  <script src="/js/settings.js?v=13"></script>
  <script src="/js/whatsapp.js?v=13"></script>
  <script src="/js/nav.js?v=13"></script>
  <script>
    renderNav("customers");

    const params = new URLSearchParams(location.search);
    const id = params.get("id");
    const mainEl = document.getElementById("main");

    const editDialog = document.getElementById("editDialog");
    const editForm   = document.getElementById("editForm");
    const editErr    = document.getElementById("editErr");

    const billDialog = document.getElementById("billDialog");
    const billForm   = document.getElementById("billForm");
    const billErr    = document.getElementById("billErr");
    const bDate      = document.getElementById("bDate");
    const bStart     = document.getElementById("bStart");
    const bEnd       = document.getElementById("bEnd");
    const bHours     = document.getElementById("bHours");
    const bMinutes   = document.getElementById("bMinutes");
    const bRate      = document.getElementById("bRate");
    const bAmount    = document.getElementById("bAmount");

    const payDialog     = document.getElementById("payDialog");
    const payForm       = document.getElementById("payForm");
    const payErr        = document.getElementById("payErr");
    const pDate         = document.getElementById("pDate");
    const pAmount       = document.getElementById("pAmount");
    const pMode         = document.getElementById("pMode");
    const pNote         = document.getElementById("pNote");
    const payCurrentDue = document.getElementById("payCurrentDue");

    const nbDialog = document.getElementById("nbDialog");
    const nbForm   = document.getElementById("nbForm");
    const nbErr    = document.getElementById("nbErr");
    const nDate    = document.getElementById("nDate");
    const nAmount  = document.getElementById("nAmount");
    const nNote    = document.getElementById("nNote");

    let currentCustomer = null;
    let currentBills = [];
    let currentPayments = [];
    let currentNotebook = [];

    if (!id) {
      mainEl.innerHTML = `<p class="error">Missing customer id.</p>`;
    } else {
      loadAll();
    }

    async function loadAll() {
      try {
        const [customer, bills, payments, notebook] = await Promise.all([
          api.get(`/api/customers/${id}`),
          api.get(`/api/customers/${id}/bills`),
          api.get(`/api/customers/${id}/payments`),
          api.get(`/api/customers/${id}/notebook-dues`),
        ]);
        currentCustomer = customer;
        currentBills = bills;
        currentPayments = payments;
        currentNotebook = notebook;
        render();
      } catch (e) {
        mainEl.innerHTML = `<p class="error">${escapeHtml(e.message)}</p>`;
      }
    }

    function render() {
      const c = currentCustomer;
      const dueClass = c.due_paise > 0 ? "positive" : "zero";

      mainEl.innerHTML = `
        <div class="card">
          <div class="row-between">
            <div>
              <h1>${escapeHtml(c.name)}</h1>
              <div class="muted">${escapeHtml(c.mobile)}</div>
              ${c.address ? `<div class="muted">${escapeHtml(c.address)}</div>` : ""}
            </div>
            <div class="text-right">
              <div class="muted">Total Due</div>
              <div class="due ${dueClass}" style="font-size:1.5rem">${formatINR(c.due_paise)}</div>
            </div>
          </div>
          <div class="row" style="margin-top:16px">
            <button id="addBillBtn">Add Bill</button>
            <button id="addNbBtn" class="secondary">Add Notebook Due</button>
            <button id="payBillBtn" class="secondary">Pay Bill</button>
            <button id="editBtn" class="secondary">Edit</button>
            <button id="deleteBtn" class="danger">Delete</button>
          </div>
        </div>

        <div class="card">
          <h2>Notebook Dues</h2>
          <div class="table-wrap" style="margin-top:8px">
            <table>
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Note</th>
                  <th class="text-right">Amount</th>
                  <th class="text-right">Allocated</th>
                  <th>Status</th>
                  <th></th>
                </tr>
              </thead>
              <tbody>${renderNotebookRows()}</tbody>
            </table>
          </div>
        </div>

        <div class="card">
          <h2>Bill History</h2>
          <div class="table-wrap" style="margin-top:8px">
            <table>
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Usage</th>
                  <th class="text-right">Rate</th>
                  <th class="text-right">Bill</th>
                  <th class="text-right">Prev Due</th>
                  <th class="text-right">Total Due</th>
                  <th>Status</th>
                  <th></th>
                </tr>
              </thead>
              <tbody>${renderBillRows()}</tbody>
            </table>
          </div>
        </div>

        <div class="card">
          <h2>Payments</h2>
          <div class="table-wrap" style="margin-top:8px">
            <table>
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Mode</th>
                  <th class="text-right">Amount</th>
                  <th>Note</th>
                  <th></th>
                </tr>
              </thead>
              <tbody>${renderPaymentRows()}</tbody>
            </table>
          </div>
        </div>
      `;

      document.getElementById("editBtn").addEventListener("click", () => {
        editForm.eName.value = c.name;
        editForm.eMobile.value = c.mobile;
        editForm.eAddress.value = c.address || "";
        editErr.hidden = true;
        editDialog.showModal();
      });

      document.getElementById("deleteBtn").addEventListener("click", async () => {
        if (!confirm(`Delete ${c.name}? This hides them but keeps their history.`)) return;
        try {
          await api.del(`/api/customers/${c.id}`);
          window.location.href = "/customers.html";
        } catch (e) { alert(e.message); }
      });

      document.getElementById("addBillBtn").addEventListener("click", openBillDialog);
      document.getElementById("addNbBtn").addEventListener("click", openNbDialog);
      document.getElementById("payBillBtn").addEventListener("click", openPayDialog);

      // ---- Bill Send ----
      mainEl.querySelectorAll("[data-send-bill]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          const bill = currentBills.find(function (x) { return String(x.id) === btn.dataset.sendBill; });
          if (!bill) return;
          openWhatsApp(currentCustomer.mobile, buildBillMessage(currentCustomer, bill));
        });
      });

      // ---- Bill Delete ----
      mainEl.querySelectorAll("[data-delete-bill]").forEach(function (btn) {
        btn.addEventListener("click", async function () {
          const bill = currentBills.find(function (x) { return String(x.id) === btn.dataset.deleteBill; });
          if (!bill) return;
          const label = formatDate(bill.bill_date) + " · " + formatUsageShort(bill.usage_minutes) + " · " + formatINR(bill.amount_paise);
          if (!confirm("Delete this bill?\n\n" + label + "\n\nThis cannot be undone.")) return;
          try {
            await api.del(`/api/bills/${bill.id}`);
            await loadAll();
          } catch (e) { alert(e.message); }
        });
      });

      // ---- Notebook Delete ----
      mainEl.querySelectorAll("[data-delete-nb]").forEach(function (btn) {
        btn.addEventListener("click", async function () {
          const n = currentNotebook.find(function (x) { return String(x.id) === btn.dataset.deleteNb; });
          if (!n) return;
          const label = formatDate(n.due_date) + " · " + formatINR(n.amount_paise);
          if (!confirm("Delete this notebook due?\n\n" + label + "\n\nThis cannot be undone.")) return;
          try {
            await api.del(`/api/notebook-dues/${n.id}`);
            await loadAll();
          } catch (e) { alert(e.message); }
        });
      });

      // ---- Payment Send Receipt ----
      mainEl.querySelectorAll("[data-send-payment]").forEach(function (btn) {
        btn.addEventListener("click", async function () {
          try {
            const detail = await api.get(`/api/payments/${btn.dataset.sendPayment}`);
            const msg = buildPaymentMessage(
              currentCustomer,
              detail,
              detail.due_before_paise,
              detail.due_after_paise
            );
            openWhatsApp(currentCustomer.mobile, msg);
          } catch (e) { alert(e.message); }
        });
      });

      // ---- Payment Delete ----
      mainEl.querySelectorAll("[data-delete-payment]").forEach(function (btn) {
        btn.addEventListener("click", async function () {
          const p = currentPayments.find(function (x) { return String(x.id) === btn.dataset.deletePayment; });
          if (!p) return;
          const label = formatDate(p.payment_date) + " · " + (p.mode === "cash" ? "Cash" : "Online") + " · " + formatINR(p.amount_paise);
          if (!confirm("Delete this payment?\n\n" + label + "\n\nThis will also remove its allocations from bills.")) return;
          try {
            await api.del(`/api/payments/${p.id}`);
            await loadAll();
          } catch (e) { alert(e.message); }
        });
      });
    }

    function renderBillRows() {
      if (!currentBills.length) {
        return `<tr><td colspan="8" class="muted">No bills yet.</td></tr>`;
      }
      let html = "";
      for (let i = 0; i < currentBills.length; i++) {
        const b = currentBills[i];
        const status = billStatus(b);
        html += `
          <tr>
            <td>${formatDate(b.bill_date)}<div class="muted" style="font-size:.8rem">${formatTime12(b.start_time)} – ${formatTime12(b.end_time)}</div></td>
            <td>${formatUsageShort(b.usage_minutes)}</td>
            <td class="text-right">${formatINR(b.rate_paise_per_hour)}/hr</td>
            <td class="text-right">${formatINR(b.amount_paise)}</td>
            <td class="text-right">${formatINR(b.previous_due_paise)}</td>
            <td class="text-right">${formatINR(b.total_due_paise)}</td>
            <td><span class="badge ${status.cls}">${status.label}</span></td>
            <td>
              <button class="secondary" data-send-bill="${b.id}" style="padding:6px 10px;font-size:.85rem">Send</button>
              <button class="danger" data-delete-bill="${b.id}" style="padding:6px 10px;font-size:.85rem">Delete</button>
            </td>
          </tr>`;
      }
      return html;
    }

    function renderNotebookRows() {
      if (!currentNotebook.length) {
        return `<tr><td colspan="6" class="muted">No notebook dues.</td></tr>`;
      }
      let html = "";
      for (let i = 0; i < currentNotebook.length; i++) {
        const n = currentNotebook[i];
        const allocated = n.allocated_paise || 0;
        let status;
        if (allocated >= n.amount_paise) status = { cls: "paid", label: "Paid" };
        else if (allocated > 0)          status = { cls: "partial", label: "Partially Paid" };
        else                             status = { cls: "unpaid", label: "Unpaid" };

        html += `
          <tr>
            <td>${formatDate(n.due_date)}</td>
            <td class="muted">${escapeHtml(n.note || "—")}</td>
            <td class="text-right">${formatINR(n.amount_paise)}</td>
            <td class="text-right">${formatINR(allocated)}</td>
            <td><span class="badge ${status.cls}">${status.label}</span></td>
            <td><button class="danger" data-delete-nb="${n.id}" style="padding:6px 10px;font-size:.85rem">Delete</button></td>
          </tr>`;
      }
      return html;
    }

    function renderPaymentRows() {
      if (!currentPayments.length) {
        return `<tr><td colspan="5" class="muted">No payments yet.</td></tr>`;
      }
      let html = "";
      for (let i = 0; i < currentPayments.length; i++) {
        const p = currentPayments[i];
        html += `
          <tr>
            <td>${formatDate(p.payment_date)}</td>
            <td>${p.mode === "cash" ? "Cash" : "Online"}</td>
            <td class="text-right">${formatINR(p.amount_paise)}</td>
            <td class="muted">${escapeHtml(p.note || "—")}</td>
            <td>
              <button class="secondary" data-send-payment="${p.id}" style="padding:6px 10px;font-size:.85rem">Send Receipt</button>
              <button class="danger" data-delete-payment="${p.id}" style="padding:6px 10px;font-size:.85rem">Delete</button>
            </td>
          </tr>`;
      }
      return html;
    }

    function billStatus(b) {
      const allocated = b.allocated_paise || 0;
      if (allocated >= b.amount_paise) return { cls: "paid", label: "Paid" };
      if (allocated > 0)              return { cls: "partial", label: "Partially Paid" };
      return { cls: "unpaid", label: "Unpaid" };
    }

    // ---------- Add Bill dialog ----------
    let usageManuallyEdited = false;

    async function openBillDialog() {
      usageManuallyEdited = false;
      billErr.hidden = true;
      bDate.value = todayISO();
      bStart.value = "07:00";
      bEnd.value   = "09:00";

      let rateRupees = 80;
      try {
        const s = await settingsCache.load();
        const paise = Number(s.default_rate_paise);
        if (Number.isFinite(paise) && paise >= 0) rateRupees = paise / 100;
      } catch (_) {}

      bRate.value = rateRupees.toString();
      recomputeUsage();
      recomputeAmount();
      billDialog.showModal();
    }

    document.getElementById("cancelBill").addEventListener("click", function () { billDialog.close(); });

    bStart.addEventListener("input", function () { if (!usageManuallyEdited) recomputeUsage(); recomputeAmount(); });
    bEnd.addEventListener("input",   function () { if (!usageManuallyEdited) recomputeUsage(); recomputeAmount(); });
    bHours.addEventListener("input",   function () { usageManuallyEdited = true; recomputeAmount(); });
    bMinutes.addEventListener("input", function () { usageManuallyEdited = true; recomputeAmount(); });
    bRate.addEventListener("input",  recomputeAmount);

    function recomputeUsage() {
      if (!bStart.value || !bEnd.value) return;
      const sParts = bStart.value.split(":").map(Number);
      const eParts = bEnd.value.split(":").map(Number);
      const diff = (eParts[0] * 60 + eParts[1]) - (sParts[0] * 60 + sParts[1]);
      if (diff > 0) {
        const hm = splitHM(diff);
        bHours.value = hm.h;
        bMinutes.value = hm.m;
      }
    }

    function recomputeAmount() {
      const h = Number(bHours.value) || 0;
      const m = Number(bMinutes.value) || 0;
      const totalMin = h * 60 + m;
      const rateRupees = Number(bRate.value) || 0;
      const amountPaise = Math.round((totalMin / 60) * rateRupees * 100);
      bAmount.textContent = formatINR(amountPaise);
    }

    billForm.addEventListener("submit", async function (e) {
      e.preventDefault();
      billErr.hidden = true;

      const h = Number(bHours.value) || 0;
      const m = Number(bMinutes.value) || 0;
      if (!Number.isInteger(h) || h < 0 || !Number.isInteger(m) || m < 0 || m > 59) {
        billErr.textContent = "Hours must be 0+, minutes must be 0–59.";
        billErr.hidden = false;
        return;
      }
      const totalMin = h * 60 + m;
      if (totalMin <= 0) {
        billErr.textContent = "Total usage must be greater than zero.";
        billErr.hidden = false;
        return;
      }
      const rateRupees = Number(bRate.value);
      if (!Number.isFinite(rateRupees) || rateRupees < 0) {
        billErr.textContent = "Rate must be zero or more.";
        billErr.hidden = false;
        return;
      }

      const payload = {
        bill_date: bDate.value,
        start_time: bStart.value,
        end_time: bEnd.value,
        usage_minutes: totalMin,
        rate_paise_per_hour: Math.round(rateRupees * 100),
      };

      try {
        await api.post(`/api/customers/${id}/bills`, payload);
        billDialog.close();
        await loadAll();
      } catch (err) {
        billErr.textContent = err.message;
        billErr.hidden = false;
      }
    });

    // ---------- Pay Bill dialog ----------
    function openPayDialog() {
      payErr.hidden = true;
      pDate.value = todayISO();
      pMode.value = "cash";
      pNote.value = "";
      const due = currentCustomer.due_paise || 0;
      payCurrentDue.textContent = formatINR(due);
      pAmount.value = due > 0 ? (due / 100).toFixed(2) : "";
      payDialog.showModal();
    }

    document.getElementById("cancelPay").addEventListener("click", function () { payDialog.close(); });

    payForm.addEventListener("submit", async function (e) {
      e.preventDefault();
      payErr.hidden = true;

      const rupees = Number(pAmount.value);
      if (!Number.isFinite(rupees) || rupees <= 0) {
        payErr.textContent = "Amount must be greater than zero.";
        payErr.hidden = false;
        return;
      }
      const amount_paise = Math.round(rupees * 100);
      if (amount_paise <= 0) {
        payErr.textContent = "Amount too small.";
        payErr.hidden = false;
        return;
      }

      const payload = {
        payment_date: pDate.value,
        amount_paise: amount_paise,
        mode: pMode.value,
        note: pNote.value.trim(),
      };

      try {
        await api.post(`/api/customers/${id}/payments`, payload);
        payDialog.close();
        await loadAll();
      } catch (err) {
        payErr.textContent = err.message;
        payErr.hidden = false;
      }
    });

    // ---------- Notebook Due dialog ----------
    function openNbDialog() {
      nbErr.hidden = true;
      nDate.value = todayISO();
      nAmount.value = "";
      nNote.value = "";
      nbDialog.showModal();
    }

    document.getElementById("cancelNb").addEventListener("click", function () { nbDialog.close(); });

    nbForm.addEventListener("submit", async function (e) {
      e.preventDefault();
      nbErr.hidden = true;

      const rupees = Number(nAmount.value);
      if (!Number.isFinite(rupees) || rupees <= 0) {
        nbErr.textContent = "Amount must be greater than zero.";
        nbErr.hidden = false;
        return;
      }
      const amount_paise = Math.round(rupees * 100);

      const payload = {
        due_date: nDate.value,
        amount_paise: amount_paise,
        note: nNote.value.trim(),
      };

      try {
        await api.post(`/api/customers/${id}/notebook-dues`, payload);
        nbDialog.close();
        await loadAll();
      } catch (err) {
        nbErr.textContent = err.message;
        nbErr.hidden = false;
      }
    });

    // ---------- Edit customer ----------
    document.getElementById("cancelEdit").addEventListener("click", function () { editDialog.close(); });

    editForm.addEventListener("submit", async function (e) {
      e.preventDefault();
      editErr.hidden = true;
      const payload = {
        name: editForm.eName.value.trim(),
        mobile: editForm.eMobile.value.trim(),
        address: editForm.eAddress.value.trim(),
      };
      try {
        await api.put(`/api/customers/${id}`, payload);
        editDialog.close();
        await loadAll();
      } catch (err) {
        editErr.textContent = err.message;
        editErr.hidden = false;
      }
    });

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function (ch) {
        return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[ch];
      });
    }
  </script>
</body>
</html>
