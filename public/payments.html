<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Payments · Tubewell Billing</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="container">
    <h1>Payments</h1>
    <div class="table-wrap" style="margin-top:12px">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Customer</th>
            <th>Mode</th>
            <th class="text-right">Amount</th>
            <th>Note</th>
          </tr>
        </thead>
        <tbody id="rows"><tr><td colspan="5" class="muted">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>

  <script src="/js/api.js?v=11"></script>
  <script src="/js/format.js?v=11"></script>
  <script src="/js/whatsapp.js?v=11"></script>
  <script src="/js/nav.js?v=11"></script>
  <script>
    renderNav("payments");
    const rowsEl = document.getElementById("rows");

    (async () => {
      try {
        const rows = await api.get("/api/all-payments");
        if (!rows.length) {
          rowsEl.innerHTML = `<tr><td colspan="5" class="muted">No payments yet.</td></tr>`;
          return;
        }
        rowsEl.innerHTML = rows.map(p => `
          <tr data-id="${p.customer_id}">
            <td>${formatDate(p.payment_date)}</td>
            <td>${escapeHtml(p.customer_name)}<div class="muted" style="font-size:.8rem">${escapeHtml(p.customer_mobile)}</div></td>
            <td>${p.mode === "cash" ? "Cash" : "Online"}</td>
            <td class="text-right">${formatINR(p.amount_paise)}</td>
            <td class="muted">${escapeHtml(p.note || "—")}</td>
          </tr>`).join("");

        rowsEl.querySelectorAll("tr[data-id]").forEach(tr => {
          tr.addEventListener("click", () => {
            window.location.href = `/customer.html?id=${tr.dataset.id}`;
          });
        });
      } catch (e) {
        rowsEl.innerHTML = `<tr><td colspan="5" class="error">${escapeHtml(e.message)}</td></tr>`;
      }
    })();

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function (ch) {
        return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[ch];
      });
    }
  </script>
</body>
</html>
